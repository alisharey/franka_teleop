<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Align</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --chip: #efeeea;
    --ok: #1f8a4c; --warn: #c26a12; --bad: #d63a2f; --accent: #2f6fdb; --ghost: #c026d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #9a9993; --line: #2e2e2b; --chip: #2a2a27;
      --ok: #4cc27f; --warn: #f0a04b; --bad: #f0584c; --accent: #6c9cf0; --ghost: #e879f9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 18px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 10px 0 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
  .chip b { color: var(--text); }
  .chip.good b { color: var(--ok); } .chip.bad b { color: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 18px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .view { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
  .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #overlay { opacity: 0; pointer-events: none; }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin: 0 4px 0 8px; }
  .side { display: grid; gap: 16px; align-content: start; }
  .state { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .state.ok { color: var(--ok); } .state.warn { color: var(--warn); } .state.idle { color: var(--muted); }
  ol.steps { margin: 0 0 10px; padding-left: 20px; font-size: 16px; }
  ol.steps li { margin: 3px 0; }
  ol.steps li:first-child { font-weight: 650; }
  .numbers { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; color: var(--muted);
             font-variant-numeric: tabular-nums; }
  .numbers b { color: var(--text); font-weight: 600; }
  .refs { display: grid; gap: 8px; }
  .ref { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 6px;
         border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .ref.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .ref img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; background: #000; }
  .ref .name { font-weight: 600; }
  .ref .meta { font-size: 12px; color: var(--muted); }
  .ref .warn { color: var(--warn); }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 11px;
         border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .save { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font: inherit; }
  .empty { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--panel); padding: 9px 14px; border-radius: 8px; display: none; max-width: 90vw; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Camera align</h1>
  <span class="chip" id="chip-camera">Camera <b>–</b></span>
  <span class="chip" id="chip-tag">Tag <b>–</b></span>
  <span class="chip" id="chip-distance">Distance <b>–</b></span>
</header>
<main>
  <section class="panel">
    <div class="view">
      <img id="stream" src="/stream" alt="Live camera view">
      <img id="overlay" alt="">
    </div>
    <div class="controls">
      <label>Saved image overlay <input type="range" id="opacity" min="0" max="80" value="0"></label>
      <span class="legend"><i style="background:#ffd400"></i>tag now<i style="background:var(--ghost)"></i>tag in saved view</span>
    </div>
  </section>
  <aside class="side">
    <section class="panel">
      <h2>Alignment</h2>
      <div class="state idle" id="state">No reference selected</div>
      <ol class="steps" id="steps"></ol>
      <div class="numbers" id="numbers"></div>
      <div class="hint" id="tolerance"></div>
    </section>
    <section class="panel">
      <h2>Save current pose</h2>
      <div class="save">
        <input type="text" id="name" placeholder="e.g. front camera, table setup">
        <button class="btn primary" id="save">Save</button>
      </div>
      <div class="hint">Hold the camera still with the tag visible. The pose is averaged over the last half second.</div>
    </section>
    <section class="panel">
      <h2>Saved poses</h2>
      <div class="refs" id="refs"></div>
    </section>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
let status = null, refsKey = '';
function esc(t) { return String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000); }
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json();
  if (!r.ok || d.error) throw new Error(d.error || r.statusText);
  return d;
}
function chip(id, html, cls) { const c = $(id); c.className = 'chip ' + (cls || ''); c.innerHTML = html; }

function render(s) {
  status = s;
  chip('chip-camera', `Camera <b>${esc(s.camera || '–')}</b> · ${s.fps ?? 0} fps`);
  chip('chip-tag', `Tag ${s.tag_id} <b>${s.tag_visible ? 'visible' : 'not visible'}</b>`, s.tag_visible ? 'good' : 'bad');
  chip('chip-distance', `Distance <b>${s.tag_distance_mm != null ? (s.tag_distance_mm / 10).toFixed(1) + ' cm' : '–'}</b>`);

  const a = s.alignment, state = $('state'), steps = $('steps'), numbers = $('numbers');
  if (!s.active_reference) {
    state.className = 'state idle'; state.textContent = 'No reference selected';
    steps.innerHTML = ''; numbers.innerHTML = '';
  } else if (!a) {
    state.className = 'state warn'; state.textContent = s.tag_visible ? 'Hold still…' : 'Tag not visible';
    steps.innerHTML = ''; numbers.innerHTML = '';
  } else {
    state.className = 'state ' + (a.aligned ? 'ok' : 'warn');
    state.textContent = a.aligned ? 'Aligned ✓' : 'Adjust the camera';
    steps.innerHTML = a.steps.map((x) => `<li>${esc(x)}</li>`).join('');
    const [x, y, z] = a.offset_mm, [tilt, pan, roll] = a.tilt_pan_roll_deg;
    numbers.innerHTML = `
      <span>Offset from saved</span><b>${a.distance_mm.toFixed(1)} mm, ${a.angle_deg.toFixed(2)}°</b>
      <span>x / y / z</span><b>${x.toFixed(1)} / ${y.toFixed(1)} / ${z.toFixed(1)} mm</b>
      <span>tilt / pan / roll</span><b>${tilt.toFixed(2)} / ${pan.toFixed(2)} / ${roll.toFixed(2)}°</b>`;
  }
  $('tolerance').textContent = `Aligned means within ${s.position_tolerance_mm} mm and ${s.angle_tolerance_deg}°. ` +
    'Directions are from the camera’s point of view (as if you look through it).';

  const key = JSON.stringify([s.references.map((r) => [r.id, r.name]), s.active_reference]);
  if (key !== refsKey) { refsKey = key; renderRefs(s); }
}

function renderRefs(s) {
  const root = $('refs');
  if (!s.references.length) { root.innerHTML = '<div class="empty">Nothing saved yet.</div>'; }
  else root.innerHTML = s.references.slice().reverse().map((r) => {
    const other = r.serial !== s.serial ? `<div class="meta warn">saved with camera ${esc(r.serial)}</div>` : '';
    return `<div class="ref ${r.id === s.active_reference ? 'active' : ''}" onclick="activate('${r.id}')">
      <img src="/references/${r.id}.jpg" alt="">
      <div><div class="name">${esc(r.name)}</div><div class="meta">${esc(r.created.replace('T', ' '))}</div>${other}</div>
      <div style="display:grid;gap:4px">
        <button class="btn small" onclick="event.stopPropagation();renameRef('${r.id}')">Rename</button>
        <button class="btn small" onclick="event.stopPropagation();deleteRef('${r.id}')">Delete</button>
      </div></div>`;
  }).join('');
  const active = s.references.find((r) => r.id === s.active_reference);
  $('overlay').src = active ? `/references/${active.id}.jpg` : '';
  $('overlay').style.display = active ? '' : 'none';
}

async function activate(id) { try { await post(`/api/references/${id}/activate`); } catch (e) { toast(e.message); } }
async function renameRef(id) {
  const r = status.references.find((x) => x.id === id);
  const name = prompt('Name', r ? r.name : '');
  if (name && name.trim()) try { await post(`/api/references/${id}/rename`, { name }); } catch (e) { toast(e.message); }
}
async function deleteRef(id) {
  const r = status.references.find((x) => x.id === id);
  if (confirm(`Delete “${r ? r.name : id}”?`)) try { await post(`/api/references/${id}/delete`); } catch (e) { toast(e.message); }
}
$('save').addEventListener('click', async () => {
  try { await post('/api/references', { name: $('name').value }); $('name').value = ''; toast('Saved'); }
  catch (e) { toast(e.message); }
});
$('opacity').addEventListener('input', (e) => { $('overlay').style.opacity = e.target.value / 100; });

async function poll() {
  try { render(await (await fetch('/api/status')).json()); }
  catch (e) { chip('chip-camera', 'Camera <b>offline</b>', 'bad'); }
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
