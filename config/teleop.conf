# Operating profile matched to Frankastein's keyboard teleop. It preserves the
# active Franka Desk collision behavior and does not replace those settings.
robot_ip = 192.168.3.200
joystick_path = /dev/input/by-id/usb-Microsoft_Android-joystick
controller_profile = xbox_android_standard
deadzone = 0.10
# Frankastein safety cap is 0.15 m/s; its keyboard steps give ~0.1-0.15 m/s.
max_linear_speed_m_s = 0.15
max_angular_speed_rad_s = 0.40
# Reaches full speed in ~0.15 s instead of ~0.3 s at the old 0.03 m/s.
max_linear_acceleration_m_s2 = 1.0
max_linear_jerk_m_s3 = 10.0
max_angular_acceleration_rad_s2 = 2.5
max_angular_jerk_rad_s3 = 25.0
initial_zero_hold_s = 0.10
# Fixed box in the robot base frame (lab-chosen limits).
workspace_x_m = 0.16, 0.70
workspace_y_m = -0.30, 0.35
workspace_z_m = 0.0, 0.71
# Frankastein moves down at half the upward step.
z_down_speed_scale = 0.5
# D-pad vertical axis (confirm with controller_probe): up = faster, down = slower.
speed_toggle_axis = 7
input_timeout_ms = 250
gripper_enabled = true
gripper_open_width_m = 0.08
gripper_open_speed_m_s = 0.08
gripper_grasp_width_m = 0.0
gripper_grasp_speed_m_s = 0.03
gripper_grasp_force_N = 50.0
gripper_grasp_epsilon_inner_m = 0.005
gripper_grasp_epsilon_outer_m = 0.08
